# HRMS Recruit — site config for a manual deployment.
#
#   Debian/Ubuntu: /etc/nginx/sites-available/hrms  (symlink into sites-enabled)
#   RHEL/Alma:     /etc/nginx/conf.d/hrms.conf
#
# Adjust `root` to wherever you copied the Angular build, and the two
# proxy_pass ports if uvicorn is not on 8000.

server {
    listen 80;
    server_name hrms.local;          # or your server's name / IP

    root /var/www/hrms;              # contents of frontend/dist/hrms/browser
    index index.html;

    access_log /var/log/nginx/hrms.access.log;
    error_log  /var/log/nginx/hrms.error.log;

    # Serving the API from the same origin as the app means the browser never
    # makes a cross-origin request, so CORS never enters the picture.
    location /api/ {
        proxy_pass         http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Resume uploads.
        client_max_body_size 12m;
        proxy_read_timeout   120s;
    }

    # FastAPI's interactive docs and health check.
    location ~ ^/(docs|redoc|openapi\.json|health)$ {
        proxy_pass       http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # Hashed build output is safe to cache hard.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Angular owns the routing; every unknown path returns the shell.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip             on;
    gzip_min_length  1024;
    gzip_types       text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
